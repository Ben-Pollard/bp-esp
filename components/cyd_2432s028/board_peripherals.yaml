peripherals:
  # Display SPI bus (HSPI = SPI2_HOST) - ILI9341 display
  - name: spi_display
    type: spi
    role: master
    config:
      spi_bus_config:
        spi_port: SPI2_HOST
        mosi_io_num: 13
        miso_io_num: -1
        sclk_io_num: 14
        quadwp_io_num: -1
        quadhd_io_num: -1
        max_transfer_sz: 32000

  # SD card SPI bus (VSPI = SPI3_HOST)
  - name: spi_sdcard
    type: spi
    role: master
    config:
      spi_bus_config:
        spi_port: SPI3_HOST
        mosi_io_num: 23
        miso_io_num: 19
        sclk_io_num: 18
        quadwp_io_num: -1
        quadhd_io_num: -1
        max_transfer_sz: 32000

  # Display backlight PWM (GPIO21, LEDC)
  - name: ledc_backlight
    type: ledc
    role: none
    config:
      gpio_num: 21
      channel: LEDC_CHANNEL_0
      timer_sel: LEDC_TIMER_0
      freq_hz: 2000
      duty: 0
      duty_resolution: LEDC_TIMER_13_BIT
      speed_mode: LEDC_LOW_SPEED_MODE
      output_invert: false

  # RGB LED — Red (GPIO4, active low, PWM)
  - name: ledc_led_red
    type: ledc
    role: none
    config:
      gpio_num: 4
      channel: LEDC_CHANNEL_1
      timer_sel: LEDC_TIMER_0
      freq_hz: 2000
      duty: 0
      duty_resolution: LEDC_TIMER_13_BIT
      speed_mode: LEDC_LOW_SPEED_MODE
      output_invert: true

  # RGB LED — Green (GPIO16, active low, PWM)
  - name: ledc_led_green
    type: ledc
    role: none
    config:
      gpio_num: 16
      channel: LEDC_CHANNEL_2
      timer_sel: LEDC_TIMER_0
      freq_hz: 2000
      duty: 0
      duty_resolution: LEDC_TIMER_13_BIT
      speed_mode: LEDC_LOW_SPEED_MODE
      output_invert: true

  # RGB LED — Blue (GPIO17, active low, PWM)
  - name: ledc_led_blue
    type: ledc
    role: none
    config:
      gpio_num: 17
      channel: LEDC_CHANNEL_3
      timer_sel: LEDC_TIMER_0
      freq_hz: 2000
      duty: 0
      duty_resolution: LEDC_TIMER_13_BIT
      speed_mode: LEDC_LOW_SPEED_MODE
      output_invert: true

  # LDR (photoresistor, GT36516) on ADC1_CH6 (GPIO34)
  - name: adc_light
    type: adc
    role: oneshot
    config:
      unit_id: ADC_UNIT_1
      channel_id: 6
      atten: ADC_ATTEN_DB_12
      bit_width: ADC_BITWIDTH_12

  # BOOT button (GPIO0, active low with internal pull-up)
  - name: gpio_boot_button
    type: gpio
    role: io
    config:
      pin: 0
      mode: GPIO_MODE_INPUT
      pull_up: true
      pull_down: false
      intr_type: GPIO_INTR_DISABLE