devices:
  # ST7789 240x320 SPI display (driver built into ESP-IDF)
  - name: display_lcd
    chip: st7789
    type: display_lcd
    sub_type: spi
    config:
      swap_xy: false
      mirror_x: false
      mirror_y: false
      x_max: 240
      y_max: 320
      invert_color: true
      need_reset: true
      frame_format: RGB565_BE
      io_spi_config:
        cs_gpio_num: 15
        dc_gpio_num: 2
        spi_mode: 3
        pclk_hz: 40000000
        trans_queue_depth: 10
        lcd_cmd_bits: 8
        lcd_param_bits: 8
        flags:
          dc_high_on_cmd: false
          dc_low_on_data: false
          dc_low_on_param: false
          octal_mode: false
          quad_mode: false
          sio_mode: false
          lsb_first: false
          cs_high_active: false
      lcd_panel_config:
        reset_gpio_num: -1
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
        data_endian: LCD_RGB_DATA_ENDIAN_BIG
        bits_per_pixel: 16
        flags:
          reset_active_high: false
        vendor_config: ""
    peripherals:
      - spi_name: spi_display

  # SD card (SPI mode) on VSPI
  - name: fs_sdcard
    type: fs_fat
    sub_type: spi
    config:
      mount_point: "/sdcard"
      vfs_config:
        format_if_mount_failed: false
        max_files: 5
        allocation_unit_size: 16384
      sub_config:
        cs_gpio_num: 5
    peripherals:
      - spi_name: spi_sdcard

  # BOOT button
  - name: boot_button
    type: button
    sub_type: gpio
    config:
      active_level: 0
      enable_power_save: false
      disable_pull: false
      long_press_time: 2000
      short_press_time: 0
      events_cfg:
        press_down: false
        press_up: false
        single_click: true
        double_click: false
        multi_click: false
        click_counts: []
        long_press_start: false
        long_press_start_time: []
        long_press_hold: false
        long_press_up: false
        long_press_up_time: []
        press_repeat: false
        press_repeat_done: false
        press_end: false
    peripherals:
      - gpio_name: gpio_boot_button